<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnitel - Панель управления</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f5f5f7; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
        .card-hover { transition: all 0.3s ease; }
        .card-hover:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="flex">

    <aside class="w-64 h-screen sticky top-0 bg-white border-r border-gray-100 p-6 flex flex-col">
        <div class="text-2xl font-bold text-blue-900 mb-10">Magnitel</div>
        <nav class="space-y-4 flex-1">
            <a href="index.html" class="flex items-center space-x-3 text-blue-600 font-medium p-2 bg-blue-50 rounded-xl">
                <span>🏠</span> <span>Главная</span>
            </a>
            <a href="catalog.html" class="flex items-center space-x-3 text-gray-500 hover:text-blue-600 p-2 transition">
                <span>📦</span> <span>Каталог</span>
            </a>
            <a href="cart.html" class="flex items-center space-x-3 text-gray-500 hover:text-blue-600 p-2 transition">
                <span>🛒</span> <span>Корзина</span>
            </a>
        </nav>
        <div class="text-xs text-gray-400 border-t pt-4">© 2026 MAGNITEL</div>
    </aside>

    <main class="flex-1 p-8">
        <header class="flex justify-between items-center mb-10">
            <div class="relative w-1/2">
                <input type="text" placeholder="Поиск по артикулу..." class="w-full p-3 pl-10 rounded-2xl border-none ring-1 ring-gray-200 focus:ring-2 focus:ring-blue-500 outline-none transition">
            </div>
            <div class="flex items-center space-x-4">
                <button class="p-2 bg-white rounded-full shadow-sm">🔔</button>
                <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center font-bold text-blue-600">CK</div>
            </div>
        </header>

        <h1 class="text-4xl font-semibold mb-2">Здравствуйте</h1>
        <p class="text-gray-500 mb-8">У вас <span class="text-blue-600 font-medium">4 активных отгрузки</span> на сегодня.</p>

        <div class="grid grid-cols-4 gap-6 mb-10">
            <div class="bg-blue-600 p-6 rounded-[24px] text-white card-hover cursor-pointer">
                <div class="text-2xl mb-4">📑</div>
                <div class="font-semibold text-lg">Мои заказы</div>
                <div class="text-blue-100 text-sm mt-2">Отслеживание статусов</div>
            </div>
            <div class="bg-white p-6 rounded-[24px] border border-gray-100 card-hover cursor-pointer">
                <div class="text-2xl mb-4 text-blue-600">📦</div>
                <div class="font-semibold text-lg text-gray-800">Корзина</div>
                <div class="text-gray-400 text-sm mt-2">Завершить заказ</div>
            </div>
            <div class="bg-white p-6 rounded-[24px] border border-gray-100 card-hover cursor-pointer">
                <div class="text-2xl mb-4 text-green-500">✨</div>
                <div class="font-semibold text-lg text-gray-800">Новинки</div>
                <div class="text-gray-400 text-sm mt-2">Поступления недели</div>
            </div>
            <div class="bg-white p-6 rounded-[24px] border border-gray-100 card-hover cursor-pointer">
                <div class="text-2xl mb-4 text-red-500">％</div>
                <div class="font-semibold text-lg text-gray-800">Скидки</div>
                <div class="text-gray-400 text-sm mt-2">Лучшие предложения</div>
            </div>
        </div>

        <div class="relative overflow-hidden rounded-[32px] bg-black h-80 flex items-center p-12 text-white mb-10">
            <div class="z-10 max-w-md">
                <div class="uppercase tracking-widest text-sm mb-4 text-gray-400">Портативная акустика</div>
                <h2 class="text-4xl font-bold mb-6">КАЧЕСТВЕННЫЙ ЗВУК, ВСЕГДА И ВЕЗДЕ</h2>
                <button class="bg-white text-black px-8 py-3 rounded-full font-medium hover:bg-gray-200 transition">Подробнее</button>
            </div>
            <img src="https://images.unsplash.com/photo-1589003077984-894e133dabab?auto=format&fit=crop&w=800&q=80" class="absolute right-0 top-0 h-full w-1/2 object-cover opacity-80" alt="Speaker">
        </div>
    </main>

</body>
</html>
